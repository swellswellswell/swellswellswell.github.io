<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swell - Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">Swell Gallery</div>
            <ul class="nav-links">
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section id="gallery" class="gallery">
        <div class="container">
            <h1>Items for Sale</h1>
            <div class="gallery-grid">
                <div class="gallery-item">
                    <div class="item-image-wrapper">
                        <img src="https://via.placeholder.com/300x300?text=Vintage+Watch" alt="Vintage Watch" class="item-image">
                    </div>
                    <h3 class="item-name">Vintage Watch</h3>
                </div>

                <div class="gallery-item">
                    <div class="item-image-wrapper">
                        <img src="https://via.placeholder.com/300x300?text=Leather+Bag" alt="Leather Bag" class="item-image">
                    </div>
                    <h3 class="item-name">Leather Bag</h3>
                </div>

                <div class="gallery-item">
                    <div class="item-image-wrapper">
                        <img src="https://via.placeholder.com/300x300?text=Sunglasses" alt="Sunglasses" class="item-image">
                    </div>
                    <h3 class="item-name">Sunglasses</h3>
                </div>

                <div class="gallery-item">
                    <div class="item-image-wrapper">
                        <img src="https://via.placeholder.com/300x300?text=Sneakers" alt="Sneakers" class="item-image">
                    </div>
                    <h3 class="item-name">Sneakers</h3>
                </div>

                <div class="gallery-item">
                    <div class="item-image-wrapper">
                        <img src="https://via.placeholder.com/300x300?text=Camera" alt="Camera" class="item-image">
                    </div>
                    <h3 class="item-name">Camera</h3>
                </div>

                <div class="gallery-item">
                    <div class="item-image-wrapper">
                        <img src="https://via.placeholder.com/300x300?text=Headphones" alt="Headphones" class="item-image">
                    </div>
                    <h3 class="item-name">Headphones</h3>
                </div>

                <div class="gallery-item">
                    <div class="item-image-wrapper">
                        <img src="https://via.placeholder.com/300x300?text=Skateboard" alt="Skateboard" class="item-image">
                    </div>
                    <h3 class="item-name">Skateboard</h3>
                </div>

                <div class="gallery-item">
                    <div class="item-image-wrapper">
                        <img src="https://via.placeholder.com/300x300?text=Vinyl+Records" alt="Vinyl Records" class="item-image">
                    </div>
                    <h3 class="item-name">Vinyl Records</h3>
                </div>

                <div class="gallery-item">
                    <div class="item-image-wrapper">
                        <img src="https://via.placeholder.com/300x300?text=Plant+Pot" alt="Plant Pot" class="item-image">
                    </div>
                    <h3 class="item-name">Plant Pot</h3>
                </div>
            </div>
        </div>
    </section>

    <section id="contact" class="contact">
        <div class="container">
            <h2>Interested?</h2>
            <p>Get in touch to inquire about items or make an offer.</p>
            <div class="social-links">
                <a href="https://github.com/swellswellswell" target="_blank">GitHub</a>
                <a href="mailto:your-email@example.com">Email</a>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Swell Gallery. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
